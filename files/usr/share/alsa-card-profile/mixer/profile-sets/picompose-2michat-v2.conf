# Profile set of the ReSpeaker 2-Mics Pi HAT V2.0 (TLV320AIC3104).
# It is the stereo-fallback mapping that PipeWire uses for the card anyway, with an output path that
# controls the DAC of the codec.

[General]
auto-profiles = yes

[Mapping stereo-fallback]
device-strings = hw:%f
fallback = yes
channel-map = front-left,front-right
paths-output = picompose-2michat-v2-output
paths-input = analog-input
priority = 1
