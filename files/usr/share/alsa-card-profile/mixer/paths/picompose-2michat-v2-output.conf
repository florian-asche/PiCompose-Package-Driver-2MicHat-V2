# Output path of the ReSpeaker 2-Mics Pi HAT V2.0 (TLV320AIC3104).
# The codec starts with HP DAC and Line DAC at -23.5 dB. Both are merged into the volume of the
# sink, so a volume of 100 % puts both at 0 dB.

[General]
priority = 99
description-key = analog-output

[Element HP DAC]
switch = off
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Line DAC]
switch = off
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
